name: Android CI — Build & Sign APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Universal Release APK (arm64-v8a + armeabi-v7a)
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java 17 ───────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ── 3. Gradle wrapper permissions ────────────────────────────────────────
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ── 4. Decode keystore from GitHub Secret ────────────────────────────────
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/release-keystore.jks

      # ── 5. Write keystore.properties ─────────────────────────────────────────
      - name: Create keystore.properties
        env:
          KEY_ALIAS:      ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:   ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          cat > keystore.properties <<EOF
          storeFile=release-keystore.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # ── 6. Build universal release APK ───────────────────────────────────────
      - name: Build universal release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      # ── 7. Upload APK artifact ───────────────────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: boykta-net-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      # ── 8. Clean up keystore ─────────────────────────────────────────────────
      - name: Clean up keystore
        if: always()
        run: |
          rm -f app/release-keystore.jks
          rm -f keystore.properties
