name: Android CI — Universal Release APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Universal Release APK (All Architectures)
    runs-on: ubuntu-latest
    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java 17 ───────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ── 3. Gradle wrapper permissions ────────────────────────────────────────
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ── 4. Decode keystore if GitHub Secret exists ───────────────────────────
      - name: Setup keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS:      ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:   ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/release-keystore.jks
            cat > keystore.properties <<EOF
          storeFile=release-keystore.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
            echo "Release keystore configured."
          else
            echo "No custom release keystore secret found. Building with standard signing configuration."
          fi

      # ── 5. Build minified universal Release APK ──────────────────────────────
      - name: Build Universal Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      # ── 6. Display APK details & size ────────────────────────────────────────
      - name: Display APK outputs
        run: |
          echo "=== Universal Release APK Output ==="
          ls -lh app/build/outputs/apk/release/*.apk || true

      # ── 7. Upload APK artifact ───────────────────────────────────────────────
      - name: Upload Universal Release APK
        uses: actions/upload-artifact@v4
        with:
          name: BoyktaNet-Universal-AllDevices-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      # ── 8. Clean up keystore ─────────────────────────────────────────────────
      - name: Clean up keystore
        if: always()
        run: |
          rm -f app/release-keystore.jks
          rm -f keystore.properties
